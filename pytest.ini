# Configuration de pytest (Phase 8 étape 17b1, docs/DESIGN.md § Phase 8 étape 17a).
# Niveaux de tests : tools/tests.sh basique | intermediaire | avance.
[pytest]
testpaths = tests
addopts = --strict-markers
markers =
    slow: calcul long, sans matériel ni attente (exclu du niveau Intermédiaire)
    audio: temps réel — fil de lecture qui attend vraiment — ou vraie carte son (exclu du niveau Intermédiaire)
    gui: vraie fenêtre principale (clients ALSA / MIDI) ou dialogue affiché avec sa boucle d'événements (exclu du niveau Intermédiaire)
